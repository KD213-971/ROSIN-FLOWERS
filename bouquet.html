<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build Your Bouquet | ROSIN</title>  
 <style>
   .order-button {
  background: #a86f7c;
  color: white;
  border: none;
  border-radius: 30px;
  padding: 16px 35px;
  margin-top: 20px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.order-button:hover {
  background: #875460;
}
   
  .flower-image {
  width: 100%;
  height: 150px;
  object-fit: contain;
  margin: 0 auto 12px;
}

.flowers-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.flower-card {
  background: #fff9fa;
  border: 1px solid #f0dfe5;
  border-radius: 18px;
  padding: 20px 12px;
  text-align: center;
}

@media (max-width: 650px) {
  .flowers-grid {
    grid-template-columns: 1fr;
  }
}
  <style>
    body {
      margin: 0;
      background: #fffaf9;
      color: #65434b;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      background: #f6e6e5;
      padding: 25px;
    }
    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
    }
    main {
      padding: 60px 20px;
    }
    .card {
      max-width: 550px;
      margin: auto;
      padding: 35px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 5px 25px #00000010;
select, input[type="number"] {
  padding: 12px;
  margin: 8px 5px;
  border: 1px solid #e5cbd0;
  border-radius: 10px;
  background: #fffaf9;
  color: #65434b;
  font-size: 15px;
  max-width: 100%;
}

input[type="number"] {
  width: 85px;
}

.card {
  max-width: 750px;
}

h2 {
  color: #a86f7c;
  font-family: Georgia, serif;
  margin-top: 30px;
}

#total {
  color: #a86f7c;
  font-weight: bold;
}    }
    .flower-image {
  display: block;
  width: 180px;
  height: 180px;
  object-fit: contain;
  background: white;
  border-radius: 15px;
  margin: 20px auto 10px;
  box-shadow: 0 4px 15px #00000012;
}
  </style>
</head>
<body>
  <header>
    <h1>ROSIN</h1>
    <p>FLOWERS & GIFTS</p>
  </header>
  <main>
    <div class="card">
      <h1>Build Your Own Bouquet</h1>
      <p>Choose your favorite flowers and colors.</p>
      <p>Your perfect bouquet starts here.</p>
      <div style="margin-top:30px;">
<h2>Choose Bouquet Size</h2>

<select id="bouquetSize" onchange="calculatePrice()">
  <option value="10">Small - Up to 10 stems</option>
  <option value="20">Medium - Up to 20 stems</option>
  <option value="35">Large - Up to 35 stems</option>
</select>

<p id="sizeMessage"></p>
        <h2>Choose Your Flowers</h2>
        <div class="flowers-grid">
          <div class="flower-card">
<img src="images/rose.jpg" alt="Roses" class="flower-image">
  <label>Roses - 8 AED each</label>
   <div class="rose-colors">
  <label>Choose Rose Colors:</label>

  <select id="roseColor">
    <option value="Red">Red</option>
    <option value="Pink">Pink</option>
    <option value="White">White</option>
    <option value="Peach">Peach</option>
  </select>

  <button type="button" onclick="addRoseColor()">
    + Add Another Color
  </button>

  <div id="extraRoseColors"></div>
</div>
  <input type="number" id="roses"
         min="0" value="0"
         oninput="calculatePrice()">
</div>
          <div class="flower-card">
<img src="images/tulip.jpg" alt="Tulips" class="flower-image">
  <label>Tulips - 12 AED each</label>
            <label>Choose Tulip Colors:</label>
        <select id="tulipColor">
  <option value="Pink">Pink</option>
  <option value="White">White</option>
  <option value="Yellow">Yellow</option>
  <option value="Purple">Purple</option>
</select>
            <button type="button" onclick="addFlowerColor('tulip')">
  + Add Another Color
</button>
<div id="extraTulipColors"></div>
  <input type="number" id="tulips"
         min="0" value="0"
         oninput="calculatePrice()">
</div>
          <div class="flower-card">
<img src="images/lily.jpg" alt="Lilies" class="flower-image">
  <label>Lilies - 20 AED each</label>
            <label>Choose Lily Colors:</label>
        <select id="lilyColor">
  <option value="White">White</option>
  <option value="Pink">Pink</option>
  <option value="Yellow">Yellow</option>
</select>
            <button type="button" onclick="addFlowerColor('lily')">
  + Add Another Color
</button>
<div id="extraLilyColors"></div>
  <input type="number" id="lilies"
         min="0" value="0"
         oninput="calculatePrice()">
</div>
          </div>

  <h2>Total: <span id="total">0</span> AED</h2>
        <div style="text-align: center; margin-top: 25px;">
  <button
    type="button"
    class="order-button"
    onclick="sendWhatsAppOrder()">
    Order via WhatsApp
  </button>
</div>
        <button type="button"
        onclick="sendWhatsAppOrder()"
        class="order-button">
  Order via WhatsApp
</button>
</div>

<script>
function calculatePrice() {
  const getQty = (id) => {
    const input = document.getElementById(id);
    return input ? Math.max(0, Math.floor(Number(input.value) || 0)) : 0;
  };

  const roses = getQty("roses");
  const tulips = getQty("tulips");
  const lilies = getQty("lilies");

  const extraQty = (selector) => {
    return Array.from(document.querySelectorAll(selector))
      .reduce((sum, input) => {
        return sum + Math.max(0, Math.floor(Number(input.value) || 0));
      }, 0);
  };

  const totalRoses = roses + extraQty(".extraRoseQty");
  const totalTulips = tulips +
    extraQty('.extraFlowerQty[data-flower="tulip"]');
  const totalLilies = lilies +
    extraQty('.extraFlowerQty[data-flower="lily"]');

  const totalStems = totalRoses + totalTulips + totalLilies;

  const sizeSelect = document.getElementById("bouquetSize");
  const maxStems = Number(sizeSelect.value);

  const total = totalRoses * 8 +
                totalTulips * 12 +
                totalLilies * 20;

  const message = document.getElementById("sizeMessage");

  if (totalStems > maxStems) {
    message.textContent =
      "Too many flowers! Maximum: " + maxStems;
    message.style.color = "red";
  } else {
    message.textContent =
      totalStems + " of " + maxStems + " stems selected";
    message.style.color = "#65434b";
  }

  document.getElementById("total").textContent = total;
}
  function addRoseColor() {
  const container = document.getElementById("extraRoseColors");

  const row = document.createElement("div");
  row.style.marginTop = "10px";

  row.innerHTML = `
    <select class="extraRoseColor">
      <option value="Red">Red</option>
      <option value="Pink">Pink</option>
      <option value="White">White</option>
      <option value="Peach">Peach</option>
    </select>

    <input type="number"
           class="extraRoseQty"
           min="0"
           value="0"
           oninput="calculatePrice()">

    <button type="button"
            onclick="this.parentElement.remove(); calculatePrice();">
      Remove
    </button>
  `;

  container.appendChild(row);
}
  function addFlowerColor(type) {
  const settings = {
    tulip: {
      container: "extraTulipColors",
      colors: ["Pink", "White", "Yellow", "Purple"]
    },
    lily: {
      container: "extraLilyColors",
      colors: ["White", "Pink", "Yellow"]
    }
  };

  const setting = settings[type];
  if (!setting) return;

  const container = document.getElementById(setting.container);
  if (!container) return;

  const row = document.createElement("div");
  row.style.marginTop = "10px";

  const select = document.createElement("select");
  select.className = "extraFlowerColor";

  setting.colors.forEach(color => {
    const option = document.createElement("option");
    option.value = color;
    option.textContent = color;
    select.appendChild(option);
  });

  const quantity = document.createElement("input");
  quantity.type = "number";
  quantity.min = "0";
  quantity.value = "0";
  quantity.className = "extraFlowerQty";
  quantity.dataset.flower = type;
  quantity.addEventListener("input", calculatePrice);

  const remove = document.createElement("button");
  remove.type = "button";
  remove.textContent = "Remove";
  remove.onclick = function() {
    row.remove();
    calculatePrice();
  };

  row.append(select, quantity, remove);
  container.appendChild(row);
}
  function sendWhatsAppOrder() {
  const phone = "971505331824";

  const getQty = (id) => {
    const el = document.getElementById(id);
    return Math.max(0, Math.floor(Number(el.value) || 0));
  };

  const flowers = [
    {
      name: "Roses",
      qtyId: "roses",
      colorId: "roseColor",
      extra: "#extraRoseColors",
      price: 8
    },
    {
      name: "Tulips",
      qtyId: "tulips",
      colorId: "tulipColor",
      extra: "#extraTulipColors",
      price: 12
    },
    {
      name: "Lilies",
      qtyId: "lilies",
      colorId: "lilyColor",
      extra: "#extraLilyColors",
      price: 20
    }
  ];

  const maxStems = Number(
    document.getElementById("bouquetSize").value
  );

  let stems = 0;
  let total = 0;
  let details = [];

  flowers.forEach(flower => {
    const entries = [];

    const mainQty = getQty(flower.qtyId);
    const mainColor =
      document.getElementById(flower.colorId).value;

    if (mainQty > 0) {
      entries.push([mainColor, mainQty]);
    }

    document.querySelectorAll(
      flower.extra + " > div"
    ).forEach(row => {
      const color = row.querySelector("select");
      const qty = row.querySelector('input[type="number"]');

      if (color && qty) {
        const amount = Math.max(
          0, Math.floor(Number(qty.value) || 0)
        );
        if (amount > 0) {
          entries.push([color.value, amount]);
        }
      }
    });

    entries.forEach(([color, qty]) => {
      stems += qty;
      total += qty * flower.price;
      details.push(
        flower.name + " - " + color + ": " + qty
      );
    });
  });

  if (stems === 0) {
    alert("Please select your flowers first.");
    return;
  }

  if (stems > maxStems) {
    alert("Please reduce the number of flowers.");
    return;
  }

  const size = document.getElementById(
    "bouquetSize"
  ).selectedOptions[0].text;

  const message =
    "Hello ROSIN! I would like to order a bouquet.\n\n" +
    "Bouquet Size: " + size + "\n\n" +
    details.join("\n") +
    "\n\nTotal Stems: " + stems +
    "\nTotal Price: " + total + " AED";

  const url = "https://wa.me/" + phone +
    "?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
}
</script>
    </div>
  </main>
</body>
</html>
