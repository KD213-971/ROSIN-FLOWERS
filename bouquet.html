<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build Your Bouquet | ROSIN</title>
  <style>
    body {
      margin: 0;
      background: #fffaf9;
      color: #65434b;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      background: #f6e6e5;
      padding: 25px;
    }
    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
    }
    main {
      padding: 60px 20px;
    }
    .card {
      max-width: 550px;
      margin: auto;
      padding: 35px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 5px 25px #00000010;
select, input[type="number"] {
  padding: 12px;
  margin: 8px 5px;
  border: 1px solid #e5cbd0;
  border-radius: 10px;
  background: #fffaf9;
  color: #65434b;
  font-size: 15px;
  max-width: 100%;
}

input[type="number"] {
  width: 85px;
}

.card {
  max-width: 750px;
}

h2 {
  color: #a86f7c;
  font-family: Georgia, serif;
  margin-top: 30px;
}

#total {
  color: #a86f7c;
  font-weight: bold;
}    }
    .flower-image {
  display: block;
  width: 180px;
  height: 180px;
  object-fit: contain;
  background: white;
  border-radius: 15px;
  margin: 20px auto 10px;
  box-shadow: 0 4px 15px #00000012;
}
  </style>
</head>
<body>
  <header>
    <h1>ROSIN</h1>
    <p>FLOWERS & GIFTS</p>
  </header>
  <main>
    <div class="card">
      <h1>Build Your Own Bouquet</h1>
      <p>Choose your favorite flowers and colors.</p>
      <p>Your perfect bouquet starts here.</p>
      <div style="margin-top:30px;">
<h2>Choose Bouquet Size</h2>

<select id="bouquetSize" onchange="calculatePrice()">
  <option value="10">Small - Up to 10 stems</option>
  <option value="20">Medium - Up to 20 stems</option>
  <option value="35">Large - Up to 35 stems</option>
</select>

<p id="sizeMessage"></p>
        <h2>Choose Your Flowers</h2>
<img src="images/rose.jpg" alt="Roses" class="flower-image">
  <label>Roses - 8 AED each</label>
        <select id="roseColor">
  <option value="Red">Red</option>
  <option value="Pink">Pink</option>
  <option value="White">White</option>
  <option value="Peach">Peach</option>
</select>
  <input type="number" id="roses"
         min="0" value="0"
         oninput="calculatePrice()">

  <br><br>
<img src="images/tulip.jpg" alt="Tulips" class="flower-image">
  <label>Tulips - 12 AED each</label>
        <select id="tulipColor">
  <option value="Pink">Pink</option>
  <option value="White">White</option>
  <option value="Yellow">Yellow</option>
  <option value="Purple">Purple</option>
</select>
  <input type="number" id="tulips"
         min="0" value="0"
         oninput="calculatePrice()">

  <br><br>
<img src="images/lily.jpg" alt="Lilies" class="flower-image">
  <label>Lilies - 20 AED each</label>
        <select id="lilyColor">
  <option value="White">White</option>
  <option value="Pink">Pink</option>
  <option value="Yellow">Yellow</option>
</select>
  <input type="number" id="lilies"
         min="0" value="0"
         oninput="calculatePrice()">

  <h2>Total: <span id="total">0</span> AED</h2>
</div>

<script>
function calculatePrice() {
  const roses = Math.max(0, Math.floor(
    Number(document.getElementById("roses").value) || 0
  ));

  const tulips = Math.max(0, Math.floor(
    Number(document.getElementById("tulips").value) || 0
  ));

  const lilies = Math.max(0, Math.floor(
    Number(document.getElementById("lilies").value) || 0
  ));

  const maxStems = Number(
    document.getElementById("bouquetSize").value
  );

  const totalStems = roses + tulips + lilies;
  const total = roses * 8 + tulips * 12 + lilies * 20;

  const message = document.getElementById("sizeMessage");

  if (totalStems > maxStems) {
    message.textContent =
      "Too many flowers! Maximum: " + maxStems;
    message.style.color = "red";
  } else {
    message.textContent =
      totalStems + " of " + maxStems + " stems selected";
    message.style.color = "#65434b";
  }

  document.getElementById("total").textContent = total;
}
</script>
    </div>
  </main>
</body>
</html>
