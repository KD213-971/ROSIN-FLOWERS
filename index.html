<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROSIN | Flowers & Gifts</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf9;
      color: #573b43;
      text-align: center;
    }
    header {
      padding: 25px;
      background: #f6e6e5;
    }
    .logo {
      font-family: Georgia, serif;
      font-size: 42px;
      letter-spacing: 7px;
    }
    .subtitle {
      font-size: 11px;
      letter-spacing: 4px;
    }
    main { padding: 80px 20px; }
    h1 {
      font-family: Georgia, serif;
      font-size: 36px;
    }
    p { line-height: 1.8; }
    button {
      background: #a86f7c;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 17px 35px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #875460; }
  </style>
</head>
<body>
  <header>
    <div class="logo">ROSIN</div>
    <div class="subtitle">FLOWERS & GIFTS</div>
  </header>

  <main>
    <h1>Flowers, Your Way.</h1>
    <p>
      Create a bouquet as unique as you are.
      <br>
      Choose your flowers, colors and size.
    </p>
    <button onclick="alert('Bouquet builder coming next!')">
      Build Your Bouquet
    </button>
  </main>
</body>
</html>
